<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTVPulse PWA Host</title>
    <style>
        body {
            background-color: #000000; /* কালো ব্যাকগ্রাউন্ড */
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            border-radius: 20px; /* লোগো একটু গোল হবে */
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #cccccc;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #e50914; /* লাল বাটন (IPTV স্টাইল) */
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff3333;
        }
    </style>
</head>
<body>

    <img src="icon-192.png" alt="IPTVPulse Logo">

    <h1>IPTVPulse PWA Server</h1>
    <p>This repository hosts the app files securely.</p>

    <a href="https://streamecho.top" class="btn">Go to Website</a>

</body>
</html>
